<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replicagent</title>
<style>
  :root {
    --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e3e2dc;
    --accent: #2f5bd3; --accent-soft: #e8eefc; --good: #1f7a4d; --warn: #a15c07; --bad: #b42318;
    --code: #f1f0ec; --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --surface: #1f1f1d; --text: #ecebe6; --muted: #a09f98; --border: #33332f;
      --accent: #7c9cf5; --accent-soft: #232b40; --good: #5cc28f; --warn: #e2a54d; --bad: #f2786b; --code: #292926;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header a { color: var(--muted); font-size: 13px; text-decoration: none; }
  header a:hover { color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  #drop { border: 2px dashed var(--border); border-radius: var(--radius); background: var(--surface); padding: 48px 20px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop strong { display: block; font-size: 17px; margin-bottom: 4px; }
  #drop span { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  input[type=url] { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }
  label.hint { display: block; color: var(--muted); font-size: 13px; margin-top: 16px; }
  .steps { list-style: none; padding: 0; margin: 12px 0 0; }
  .steps li { padding: 6px 0 6px 28px; position: relative; color: var(--muted); }
  .steps li::before { content: ""; position: absolute; left: 6px; top: 13px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--border); }
  .steps li.done { color: var(--text); }
  .steps li.done::before { background: var(--good); border-color: var(--good); }
  .steps li.active { color: var(--text); font-weight: 600; }
  .steps li.active::before { border-color: var(--accent); border-top-color: transparent; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { border-color: var(--bad); }
  .error h2 { color: var(--bad); }
  h2 { font-size: 16px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .title { font-size: 22px; line-height: 1.3; margin: 0 0 6px; letter-spacing: -0.01em; }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .score { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .score .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .score .value { font-size: 34px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 4px 0; }
  .score .value small { font-size: 16px; color: var(--muted); font-weight: 400; }
  .score .value.text { font-size: 22px; padding: 7px 0; }
  .claim { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 10px 0; border-top: 1px solid var(--border); }
  .claim:first-of-type { border-top: 0; padding-top: 0; }
  .claim .head { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .claim .reported { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .bar { height: 6px; background: var(--code); border-radius: 3px; overflow: hidden; }
  .bar div { height: 100%; background: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .table-wrap { overflow-x: auto; }
  .finding { border-top: 1px solid var(--border); padding: 14px 0; }
  .finding:first-of-type { border-top: 0; padding-top: 0; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; margin-right: 8px; vertical-align: 2px; }
  .sev-critical, .sev-high { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
  .sev-medium { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
  .sev-low, .sev-informational { background: var(--accent-soft); color: var(--accent); }
  blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--border); background: var(--code); border-radius: 0 6px 6px 0; font-size: 13px; white-space: pre-wrap; }
  pre { background: var(--code); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  pre code { overflow-wrap: normal; }
  ul.plain { margin: 0; padding-left: 20px; }
  ul.plain li { margin: 4px 0; }
  details summary { cursor: pointer; font-weight: 600; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  button, .button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; text-decoration: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hidden { display: none; }
  @media (max-width: 600px) { .scores { grid-template-columns: 1fr; } .title { font-size: 19px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Replicagent</h1>
    <a href="/" id="new-link">New audit</a>
  </header>

  <section id="upload-view">
    <div id="drop" tabindex="0" role="button" aria-label="Choose a PDF">
      <strong>Drop a paper PDF here</strong>
      <span>or click to choose a file · up to 25 MB, 80 pages</span>
      <input type="file" id="file" accept="application/pdf,.pdf" class="hidden">
    </div>
    <label class="hint" for="repo">Replication package (optional). Without one, the audit looks for links in the paper.</label>
    <div class="row"><input type="url" id="repo" placeholder="https://github.com/owner/repository or https://zenodo.org/records/…"></div>
  </section>

  <section id="progress-view" class="card hidden">
    <h2 id="progress-title">Auditing</h2>
    <div class="muted small" id="progress-meta"></div>
    <ul class="steps" id="steps"></ul>
  </section>

  <section id="error-view" class="card error hidden">
    <h2>The audit stopped</h2>
    <p id="error-stage" class="small muted"></p>
    <p id="error-text"></p>
  </section>

  <section id="report-view" class="hidden"></section>
</main>

<script>
const STEPS = [
  ["Reading the paper", /reading the paper|ingestion/i],
  ["Extracting claims", /extracting|claims/i],
  ["Finding and inspecting the replication package", /discovering|inspecting/i],
  ["Reviewing the evidence", /reviewing/i],
  ["Checking evidence and scoring", /checking evidence|calculating/i],
];
const $ = (id) => document.getElementById(id);

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else node.setAttribute(key, value);
  }
  for (const child of children.flat(Infinity)) {
    if (child == null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

function show(view) {
  for (const id of ["upload-view", "progress-view", "error-view", "report-view"]) $(id).classList.toggle("hidden", id !== view);
}

// ---------------------------------------------------------------- upload

const drop = $("drop"), picker = $("file");
drop.addEventListener("click", () => picker.click());
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); picker.click(); } });
picker.addEventListener("change", () => picker.files[0] && submit(picker.files[0]));
for (const type of ["dragenter", "dragover"]) drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.add("over"); });
for (const type of ["dragleave", "drop"]) drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.remove("over"); });
drop.addEventListener("drop", (e) => { const file = e.dataTransfer.files[0]; if (file) submit(file); });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => e.preventDefault());

async function submit(file) {
  if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") return fail("Upload", "Choose a PDF file.");
  const repo = $("repo").value.trim();
  const query = repo ? `?repository_url=${encodeURIComponent(repo)}` : "";
  showProgress({ stage: "Uploading", state: "queued" }, file.name);
  try {
    const response = await fetch(`/audits/upload${query}`, { method: "POST", body: file, headers: { "Content-Type": "application/pdf", "X-Filename": encodeURIComponent(file.name) } });
    const body = await response.json();
    if (!response.ok) return fail("Upload", body.detail || `The server answered ${response.status}.`);
    location.hash = body.audit_id;
  } catch (error) {
    fail("Upload", `The server could not be reached: ${error.message}`);
  }
}

// ---------------------------------------------------------------- progress

let timer = null;

async function follow(auditId) {
  clearTimeout(timer);
  try {
    const response = await fetch(`/audits/${encodeURIComponent(auditId)}`);
    if (response.status === 404) return fail("Lookup", "This audit was not found.");
    const status = await response.json();
    if (status.state === "blocked") return fail(status.stage, status.error || "The cause is unknown.");
    if (String(status.state).startsWith("completed")) return loadReport(auditId);
    showProgress(status, `Audit ${auditId}`);
  } catch (error) {
    showProgress({ stage: "Waiting for the server", state: "running" }, `Audit ${auditId}`);
  }
  timer = setTimeout(() => follow(auditId), 2000);
}

function showProgress(status, meta) {
  show("progress-view");
  $("progress-title").textContent = status.state === "queued" ? "Starting the audit" : "Auditing the paper";
  $("progress-meta").textContent = `${meta} · ${status.stage || ""}`;
  const active = STEPS.findIndex(([, pattern]) => pattern.test(status.stage || ""));
  $("steps").replaceChildren(...STEPS.map(([label], index) =>
    el("li", { class: index < active ? "done" : index === active ? "active" : "", text: label })));
}

function fail(stage, message) {
  clearTimeout(timer);
  show("error-view");
  $("error-stage").textContent = stage || "";
  $("error-text").textContent = message;
}

// ---------------------------------------------------------------- report

async function loadReport(auditId) {
  const response = await fetch(`/audits/${encodeURIComponent(auditId)}/report`);
  if (!response.ok) return fail("Report", "The report could not be loaded.");
  renderReport(await response.json());
}

function scoreCard(label, breakdown) {
  const value = breakdown.score;
  return el("div", { class: "score" },
    el("div", { class: "label", text: label }),
    el("div", { class: value == null ? "value text" : "value" }, value == null ? "Not assessed" : String(value), value == null ? null : el("small", { text: " / 10" })),
    el("div", { class: "bar" }, el("div", { style: `width:${value == null ? 0 : value * 10}%` })),
    el("div", { class: "small muted", style: "margin-top:8px", text: `${breakdown.criteria_assessed} of ${breakdown.criteria_total} criteria assessed` }));
}

function section(title, ...content) {
  return el("div", { class: "card" }, el("h2", { text: title }), ...content);
}

function words(text) {
  return String(text).replaceAll("_", " ").replace(/^./, (c) => c.toUpperCase());
}

function renderReport(report) {
  const paper = report.paper, repository = report.repository || {};
  // Archive paths start with a folder named after the pinned revision. It adds nothing here.
  const revision = String(repository.revision || "").replace(/^zenodo:/, "");
  const shortPath = (path) => { const [top, ...rest] = path.split("/"); return revision && rest.length && top.includes(revision.slice(0, 12)) ? rest.join("/") : path; };
  const view = $("report-view");
  const parts = [];

  parts.push(el("div", { class: "card" },
    el("p", { class: "title", text: paper.title }),
    el("div", { class: "muted small", text: (paper.authors || []).join(", ") }),
    el("p", { text: paper.contribution }),
    el("p", { class: "small muted", text: report.summary }),
    el("div", { class: "small muted" },
      repository.source ? el("div", {}, "Package: ", el("code", { text: repository.source }), repository.revision ? el("span", { text: ` at ${String(repository.revision).slice(0, 12)}` }) : null)
                        : el("div", { text: `Package: ${repository.status === "blocked" ? "not found or blocked" : "unresolved"}` }),
      el("div", { text: `Audit ${report.audit_id}` }))));

  parts.push(el("div", { class: "scores" }, scoreCard("Static score", report.static_score), scoreCard("Dynamic score", report.dynamic_score)));

  if (paper.claims?.length) {
    parts.push(section("Reported results",
      paper.claims.map((c) => el("div", { class: "claim" },
        el("div", { class: "head", text: `${c.claim_id} · ${c.artifact}` }),
        el("div", { class: "reported", text: c.reported_value }),
        el("div", { text: c.statement })))));
  }

  if (report.cached_result_comparisons?.length) {
    parts.push(section("Independent checks of stored results",
      el("table", {},
        el("thead", {}, el("tr", {}, ["Claim", "Benchmark", "Reported", "Counted", "Result"].map((h) => el("th", { text: h })))),
        el("tbody", {}, report.cached_result_comparisons.map((c) => el("tr", {},
          el("td", { text: c.claim_id }), el("td", { text: c.benchmark }), el("td", { class: "num", text: c.reported_value }),
          el("td", { class: "num", text: c.observed_value }), el("td", { text: c.matches ? "Matches" : "Differs" })))))));
  }

  parts.push(section("Static rubric",
    el("div", { class: "table-wrap" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", { text: "Criterion" }), el("th", { text: "Awarded" }), el("th", { text: "Max" }), el("th", { text: "Status" }))),
      el("tbody", {}, report.static_score.components.map((c) => el("tr", {},
        el("td", { text: words(c.criterion) }), el("td", { class: "num", text: c.awarded == null ? "—" : c.awarded }),
        el("td", { class: "num", text: c.maximum }), el("td", { class: "muted", text: words(c.status) })))))),
    el("p", { class: "small muted", text: report.static_score.rationale })));

  const findings = report.findings || [];
  parts.push(section(`Findings (${findings.length})`,
    findings.length ? findings.map((f) => el("div", { class: "finding" },
      el("h3", {}, el("span", { class: `badge sev-${f.severity}`, text: f.severity }), f.title),
      el("p", { text: f.explanation }),
      f.quote ? el("blockquote", { text: f.quote }) : null,
      el("div", { class: "small" }, el("strong", { text: "Impact: " }), f.reproducibility_impact),
      el("div", { class: "small" }, el("strong", { text: "Suggested action: " }), f.remediation),
      el("div", { class: "small muted", text: `${f.evidence_id} · ${f.basis === "observation" ? "deterministic observation" : "agent interpretation of a verified quote"}` })))
    : el("p", { class: "muted", text: "No findings passed the evidence check." })));

  if (report.reproduction_plan?.length) {
    parts.push(section("Proposed reproduction plan (not executed)",
      report.reproduction_plan.map((step, index) => el("div", { class: "finding" },
        el("h3", { text: `${index + 1}. ${step.target}` }),
        step.relevant_files?.length ? el("div", { class: "small" }, "Files: ", step.relevant_files.map((f, i) => [i ? ", " : "", el("code", { text: shortPath(f) })])) : null,
        step.prerequisites?.length ? el("div", { class: "small", text: `Prerequisites: ${step.prerequisites.join("; ")}` }) : null,
        step.proposed_command ? el("pre", {}, el("code", { text: step.proposed_command })) : null,
        el("div", { class: "small muted", text: `Expected: ${step.expected_result}` })))));
  }

  parts.push(section("Limits of this audit", el("ul", { class: "plain" }, (report.limitations || []).map((l) => el("li", { text: l })))));

  if (report.rejected_evidence_references?.length) {
    parts.push(el("div", { class: "card" }, el("details", {},
      el("summary", { text: `Rejected by the evidence check (${report.rejected_evidence_references.length})` }),
      el("ul", { class: "plain small", style: "margin-top:8px" }, report.rejected_evidence_references.map((r) => el("li", { text: r }))))));
  }

  parts.push(el("div", { class: "actions" },
    el("a", { class: "button", href: `/audits/${encodeURIComponent(report.audit_id)}/report?format=markdown`, target: "_blank", text: "Markdown report" }),
    el("a", { class: "button", href: `/audits/${encodeURIComponent(report.audit_id)}/report`, target: "_blank", text: "JSON report" }),
    el("a", { class: "button", href: "/", text: "Audit another paper" })));

  view.replaceChildren(...parts);
  show("report-view");
  document.title = `Replicagent · ${paper.title}`;
}

// ---------------------------------------------------------------- routing

function route() {
  const auditId = location.hash.slice(1);
  if (/^[A-Za-z0-9_-]{1,80}$/.test(auditId)) follow(auditId);
  else { clearTimeout(timer); show("upload-view"); }
}
window.addEventListener("hashchange", route);
$("new-link").addEventListener("click", (e) => { e.preventDefault(); history.pushState("", "", "/"); route(); });
route();
</script>
</body>
</html>
