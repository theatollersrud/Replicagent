[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replicagent"
version = "0.1.0"
description = "An evidence-grounded research paper reproducibility audit demo."
requires-python = ">=3.11"
dependencies = [
  "google-adk==2.13.0",
  "google-genai==2.34.0",
  "pydantic==2.12.5",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pypdf==6.12.2",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
include = ["replicagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
